version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: secureclaw-api
    ports:
      - '8000:8000'
    env_file: .env
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - secureclaw-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: secureclaw-frontend
    ports:
      - '3000:80'
    networks:
      - secureclaw-net
    depends_on:
      - api
    restart: unless-stopped

networks:
  secureclaw-net:
    driver: bridge
